add_newline = true
command_timeout = 200
# Gray text with the repo name in the normal text color and a blue prompt, like T3 Code.
# Named colors come from the terminal theme, so they follow light and dark mode.
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold blue)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bright-black"
repo_root_style = "bold"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic bright-black"

[git_status]
format     = '[$all_status]($style)'
style      = "blue"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
