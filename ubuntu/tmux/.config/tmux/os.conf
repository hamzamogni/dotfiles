# Orange tmux on Ubuntu, so it's clear which machine you're on. A darker orange with white text in
# light mode.
set -g @accent "#feaf62"
set -g @on-accent "#101010"
set-hook -g client-dark-theme[0] 'set -g @accent "#feaf62" ; set -g @on-accent "#101010"'
set-hook -g client-light-theme[0] 'set -g @accent "#d9730d" ; set -g @on-accent "#ffffff"'
